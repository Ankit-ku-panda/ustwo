<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12062e">
<title>UsTwo Arcade Game</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./arcade.css">
</head>
<body class="gm-page campaign-mode">
<div class="gm-bg" aria-hidden="true">
  <div class="gm-sun"></div><div class="gm-floor"></div>
  <i class="gm-float f1"></i><i class="gm-float f2"></i><i class="gm-float f3"></i>
  <i class="gm-float f4"></i><i class="gm-float f5"></i>
</div>
<main id="game">
  <section class="gm-stage">
    <div class="gm-hud">
      <div><span class="gm-k">SCORE</span><b id="hud-score">0</b></div>
      <div><span class="gm-k">TARGET</span><b id="hud-best">0</b></div>
      <div><span class="gm-k" id="hud-k3">LIVES</span><b id="hud-v3">-</b></div>
    </div>
    <div class="gm-board" id="gm-board">
      <canvas id="gl" aria-label="Game view"></canvas>
      <div class="gm-whack" id="whack" hidden><div class="gm-holes" id="holes"></div></div>
      <div class="gm-toast" id="gm-toast" aria-hidden="true"></div>
      <div class="gm-overlay" id="gm-overlay">
        <h2 id="ov-title">Ready?</h2><p id="ov-text"></p>
        <button class="gm-go" id="ov-btn" type="button">Start</button>
        <small id="ov-keys"></small>
      </div>
    </div>
    <div class="gm-under"><button class="gm-mini" id="gm-mute" type="button" aria-pressed="false">SOUND: ON</button><span class="gm-hint">Space or Enter starts. P pauses.</span></div>
    <p class="gm-sr" id="gm-status" role="status" aria-live="polite"></p>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="./arcade.js"></script>
</body>
</html>
